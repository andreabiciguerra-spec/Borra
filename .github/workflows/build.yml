name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
      - run: |
          unzip -o "$(ls *.zip | head -1)" -d proyecto
          cd proyecto/CoheteEspacial1194
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: cohete-espacial-jar
          path: proyecto/CoheteEspacial1194/build/libs/*.jar
